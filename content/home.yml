# Content for the Rancho MATHCOUNTS home page.
#
# Every piece of translatable text has an `en`, `zh`, and `ko` key.
# To add a language, add a key here and to the language switcher — nothing
# in the build needs to change.
#
# Plain text only: no HTML and no markdown. Let long lines wrap naturally;
# YAML folds them back into one paragraph. A blank line inside a `>-` block
# becomes a real paragraph break.

title: Rancho MATHCOUNTS

announce:
  en: >-
    Congratulations to everyone who participated in our competitive tryouts.
    We're excited to welcome 41 outstanding students to this year's program!
  zh: >-
    祝贺所有参加本次选拔的同学！我们很高兴迎来 41 位优秀学生加入今年的项目。
  ko: >-
    치열한 선발 과정에 참여해 준 모든 학생에게 축하를 전합니다. 올해 41명의 우수한
    학생을 프로그램에 맞이하게 되어 기쁩니다!

main:
  head: Rancho MATHCOUNTS

  subtext:
    en: Rancho San Joaquin Middle School presents
    zh: 兰乔圣华金中学呈献
    ko: 란초 샌와킨 중학교가 선보입니다

  lede:
    en: >-
      MATHCOUNTS is a weekly after-school math enrichment program and learning
      community led by coaches from University High School and Sage High School.
      We are dedicated to helping students prepare for mathematics competitions
      and develop as mathematicians. If you have any questions, please contact
      Liz Gastelum (Room B6).
    zh: >-
      MATHCOUNTS 是一项每周课后开展的数学拓展项目，也是一个由 University High School
      和 Sage High School 的教练共同带领的学习社群。我们致力于帮助学生备战数学竞赛，
      并在数学之路上不断成长。如有任何问题，请联系 Gastelum 老师（B6 教室）。
    ko: >-
      MATHCOUNTS는 University High School과 Sage High School의 코치진이 이끄는 주 1회
      방과 후 수학 심화 프로그램이자 학습 공동체입니다. 저희는 학생들이 수학 경시대회를
      준비하고 수학자로서 성장할 수 있도록 돕습니다. 궁금한 점이 있으면 Gastelum
      선생님(B6 교실)에게 문의해 주세요.

  picture:
    src: home.jpg
    alt:
      en: >-
        The whole club gathered outside on campus for a group photo, some still
        holding plates of pie.
      zh: >-
        全体社团成员在校园户外合影，有些人手里还端着装派的盘子。
      ko: >-
        동아리 전체가 교내 야외에 모여 단체 사진을 찍고 있으며, 일부는 아직 파이 접시를
        들고 있습니다.

  stats:
    - value: 41
      label:
        en: Club Members
        zh: 社团成员
        ko: 동아리 회원
    - value: 156
      label:
        en: Students Trying Out
        zh: 参加选拔的学生
        ko: 선발 참가 학생
    - value: 28
      label:
        en: Number of Meetings
        zh: 活动场次
        ko: 모임 횟수

faq:
  - question:
      en: Can you participate in both NHD and MATHCOUNTS?
      zh: 可以同时参加 NHD 和 MATHCOUNTS 吗？
      ko: NHD와 MATHCOUNTS에 동시에 참여할 수 있나요?
    answer:
      en: >-
        Unfortunately, we cannot accommodate students who wish to participate in
        both NHD and MATHCOUNTS this year, as they meet at the same time. We
        request that students make a choice.
      zh: >-
        很遗憾，NHD 与 MATHCOUNTS 的活动时间冲突，今年无法两者兼顾，请同学们选择其一。
      ko: >-
        아쉽게도 NHD와 MATHCOUNTS는 같은 시간에 진행되어 올해는 두 프로그램에 모두
        참여할 수 없습니다. 둘 중 하나를 선택해 주세요.

pictures:
  - src: pie.jpg
    alt:
      en: >-
        Students stand around a classroom table covered with paper plates of pie.
      zh: >-
        学生们围站在教室的桌子旁，桌上摆满了装着派的纸盘。
      ko: >-
        학생들이 파이가 담긴 종이 접시로 가득한 교실 탁자 주위에 둘러서 있습니다.
    caption:
      en: eating pie
      zh: 吃派
      ko: 파이 먹기
    title:
      en: MATHCOUNTS isn't just math
      zh: MATHCOUNTS 不仅仅是数学
      ko: MATHCOUNTS는 수학만이 아닙니다
    date:
      en: March 12th, 2026
      zh: 2026年3月12日
      ko: 2026년 3월 12일
    lede:
      en: >-
        We care about student well-being, not just their performance at
        competitions. Coaches plan interactive activities, like computing π to
        9 digits by hand for π day.
      zh: >-
        我们关心的不只是学生在比赛中的表现，更是他们的身心健康。教练们会策划各种互动活动，
        例如在“圆周率日”（π Day）用手算出圆周率的前九位。
      ko: >-
        저희는 대회 성적뿐 아니라 학생들의 건강과 행복도 소중히 생각합니다. 코치진은 파이
        데이에 원주율을 손으로 아홉 자리까지 계산해 보는 등 다양한 체험 활동을 준비합니다.

  - src: state.jpeg
    alt:
      en: >-
        Four students and their coach hold trophies in front of a competition
        backdrop.
      zh: >-
        四名学生与他们的教练在竞赛背景板前手捧奖杯。
      ko: >-
        학생 네 명과 코치가 대회 배경막 앞에서 트로피를 들고 있습니다.
    caption:
      en: first place at state
      zh: 州级比赛第一名
      ko: 주 대회 1위
    title:
      en: MATHCOUNTS is a lot of math
      zh: MATHCOUNTS 也确实是很多很多数学
      ko: MATHCOUNTS는 수학이 아주 많습니다
    date:
      en: March 21st, 2026
      zh: 2026年3月21日
      ko: 2026년 3월 21일
    lede:
      en: >-
        Rancho MATHCOUNTS has historically been successful. Last year we won
        first place at the Southern California MATHCOUNTS State competition.
      zh: >-
        Rancho MATHCOUNTS 历来表现出色。去年，我们在南加州 MATHCOUNTS
        州级竞赛中荣获第一名。
      ko: >-
        Rancho MATHCOUNTS는 오랫동안 좋은 성적을 거두어 왔습니다. 지난해에는 남캘리포니아
        MATHCOUNTS 주 대회에서 1위를 차지했습니다.
